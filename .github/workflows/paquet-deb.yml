name: Paquet .deb

# À chaque tag « vX.Y.Z » : construit le .deb dans un Debian 13 propre, calcule SHA256SUMS et les dépose dans une
# release BROUILLON (rien n'est publié tant que vous ne cliquez pas sur « Publish release »).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - name: Outils de construction
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates gh debhelper dh-python pybuild-plugin-pyproject python3-all python3-setuptools dpkg-dev
      - uses: actions/checkout@v4
      - name: Construction
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dpkg-buildpackage -us -uc -b
          mkdir -p dist && mv ../scrinium_*_all.deb dist/
          cd dist && sha256sum scrinium_*_all.deb | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: paquet-deb
          path: dist/*
      - name: Release brouillon
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --title "Scrinium ${GITHUB_REF_NAME#v}" --generate-notes
          fi
