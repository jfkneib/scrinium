name: Paquet .deb

# À chaque tag « vX.Y.Z » : construit le .deb dans un Debian 13 propre, calcule SHA256SUMS et les dépose dans une
# release BROUILLON (rien n'est publié tant que vous ne cliquez pas sur « Publish release »).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à construire (ex. v0.3.0) ; la release brouillon est créée ou complétée pour ce tag"
        required: true

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - name: Outils de construction
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates gh build-essential debhelper dh-python pybuild-plugin-pyproject python3-all python3-setuptools dpkg-dev
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Construction
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dpkg-buildpackage -us -uc -b
          mkdir -p dist && mv ../scrinium_*_all.deb dist/
          cd dist && sha256sum scrinium_*_all.deb | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: paquet-deb
          path: dist/*
      - name: Release brouillon
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --title "Scrinium ${TAG#v}" --generate-notes
          fi
