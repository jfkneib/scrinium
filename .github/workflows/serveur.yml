name: Serveur

on:
  push:
    branches: [main, dev, feat/partage]
    paths: ['serveur/**', 'docs/api-partage.md', '.github/workflows/serveur.yml']
  pull_request:
    paths: ['serveur/**']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring
      - name: Tests du serveur
        run: php serveur/tests/run.php
