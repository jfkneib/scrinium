name: Windows (PyInstaller)

# Construit le programme Windows de Scrinium (dossier avec scrinium.exe) sur une machine Windows de GitHub.
# Pourquoi sur GitHub : PyInstaller ne sait pas fabriquer un .exe Windows depuis Linux ; il faut un vrai Windows.
# Déclenché : à chaque push touchant le packaging ou le code, et à chaque tag « v… ».
# Résultat : un fichier .zip téléchargeable dans l'onglet Actions (« Artifacts »), sans publier de release.
on:
  push:
    branches: [dev, main]
    paths: ["packaging/windows/**", ".github/workflows/windows.yml", "src/**", "plugins/**", "setup.py", "pyproject.toml", "po/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write                      # nécessaire pour joindre l'installateur à la release d'un tag (étape finale)

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"            # une version précise : le programme emballe CE Python-là

      - name: Installer Scrinium et PyInstaller
        # « pip install . » (sans -e) est indispensable : c'est lui qui fabrique les traductions et copie les extensions
        # dans le paquet (voir setup.py). PyInstaller ira ensuite chercher le paquet installé.
        run: python -m pip install . pyinstaller

      - name: Fabriquer l'icône (facultatif)
        continue-on-error: true             # sans icône personnalisée, le programme reste utilisable
        run: python packaging/windows/faire_icone.py src/scrinium/icons/scrinium.svg packaging/windows/scrinium.ico

      - name: Construire avec PyInstaller
        run: pyinstaller packaging/windows/scrinium.spec --noconfirm

      - name: Vérifications rapides du résultat
        shell: pwsh
        run: |
          $d = "dist\scrinium"
          # 1. Les fichiers indispensables sont là (huit extensions, traduction anglaise, icônes)
          $ext = (Get-ChildItem "$d\_internal\scrinium\plugins_officiels" -Directory).Count
          if ($ext -ne 8) { throw "Extensions embarquées : $ext (8 attendues)" }
          if (-not (Test-Path "$d\_internal\scrinium\locale\en\LC_MESSAGES\scrinium.mo")) { throw "Traduction anglaise absente" }
          if (-not (Test-Path "$d\_internal\scrinium\icons\help-about.svg")) { throw "Icônes absentes" }
          # 2. Le programme en console démarre et lit/écrit des fiches (chiffrement compris) dans un dossier de test
          $env:SCRINIUM_HOME = "$env:RUNNER_TEMP\scrinium-test"
          & "$d\scrinium-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "scrinium-cli --version a échoué" }
          & "$d\scrinium-cli.exe" rescue list
          if ($LASTEXITCODE -ne 0) { throw "scrinium-cli rescue list a échoué" }
          # 3. Le programme graphique démarre et reste ouvert quelques secondes (écran virtuel « offscreen »)
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:SCRINIUM_INSTANCE = "ci-windows"
          $p = Start-Process "$d\scrinium.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "scrinium.exe s'est arrêté (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - name: Archive à télécharger
        shell: pwsh
        run: Compress-Archive -Path dist\scrinium -DestinationPath Scrinium-windows.zip

      # ---- Installateur (NSIS) : un seul fichier Scrinium-X.Y.Z-setup.exe ---------------------------------------------
      - name: Installer NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append     # rend makensis utilisable

      - name: Fabriquer l'installateur
        shell: pwsh
        run: |
          $v = python -c "import scrinium; print(scrinium.__version__)"
          echo "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          makensis /DVERSION=$v packaging\windows\scrinium.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis a échoué" }
          Get-Item "packaging\windows\Scrinium-$v-setup.exe" | Select-Object Name, Length

      - name: Essai de l'installateur (installation et désinstallation silencieuses)
        shell: pwsh
        run: |
          $setup = (Resolve-Path "packaging\windows\Scrinium-$env:VERSION-setup.exe").Path
          $cible = "$env:RUNNER_TEMP\Scrinium essai"                  # un chemin avec une espace : cas réel fréquent
          # Des « fiches » de l'utilisateur : elles doivent survivre à la désinstallation
          $fiches = "$env:APPDATA\scrinium"; New-Item -ItemType Directory -Force $fiches | Out-Null
          Set-Content "$fiches\temoin.txt" "mes fiches"
          # 1. Installation silencieuse (/S) dans un dossier choisi (/D= doit être le DERNIER paramètre)
          Start-Process $setup -ArgumentList "/S", "/D=$cible" -Wait
          if (-not (Test-Path "$cible\scrinium.exe")) { throw "scrinium.exe absent après installation" }
          if (-not (Test-Path "$cible\uninstall.exe")) { throw "uninstall.exe absent" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Scrinium\Scrinium.lnk")) { throw "raccourci du menu Démarrer absent" }
          $cle = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Scrinium"
          if ($cle.DisplayVersion -ne $env:VERSION) { throw "version inscrite : $($cle.DisplayVersion)" }
          # 2. Le programme installé fonctionne
          $env:SCRINIUM_HOME = "$env:RUNNER_TEMP\scrinium-installe"
          & "$cible\scrinium-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "le programme installé ne démarre pas" }
          # 3. Désinstallation silencieuse (_?= force l'attente de la fin du désinstalleur)
          Start-Process "$cible\uninstall.exe" -ArgumentList "/S", "_?=$cible" -Wait
          Start-Sleep -Seconds 2
          if (Test-Path "$cible\scrinium.exe") { throw "scrinium.exe encore présent après désinstallation" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Scrinium\Scrinium.lnk") { throw "raccourci non supprimé" }
          if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Scrinium") { throw "inscription non supprimée" }
          if (-not (Test-Path "$fiches\temoin.txt")) { throw "LES FICHES ONT ÉTÉ SUPPRIMÉES" }
          echo "Installation, lancement et désinstallation : OK (les fiches sont conservées)"

      - uses: actions/upload-artifact@v4
        with:
          name: Scrinium-windows
          path: |
            Scrinium-windows.zip
            packaging/windows/Scrinium-*-setup.exe
          retention-days: 30

      # Sur un tag « v… » seulement : l'installateur est joint à la release (brouillon créé au besoin ; le .deb vient
      # d'un autre workflow). Rien n'est publié : la release reste un brouillon tant que vous ne la publiez pas.
      - name: Joindre l'installateur à la release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $fichier = (Get-Item "packaging\windows\Scrinium-*-setup.exe").FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --draft --title "Scrinium $($tag.TrimStart('v'))" --notes "Installateur Windows." 2>$null }
          gh release upload $tag $fichier --clobber
