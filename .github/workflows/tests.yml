name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bibliothèques système de Qt (affichage hors écran)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 php-cli php-sqlite3 php-mbstring openssl
      - name: Installation
        run: python -m pip install -e ".[test]"
      - name: Textes traduits (anglais complet, marqueurs identiques)
        run: python outils/i18n.py verifier
      - name: Tests
        run: python -m pytest -q tests -p no:cacheprovider
        env:
          QT_QPA_PLATFORM: offscreen
