[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrinium"
dynamic = ["version"]
description = "Notes organised by topic, lockable with a password (AES-256), avec clé de secours facultative"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = ["cryptography>=41", "PyQt6>=6.4"]
classifiers = [
  "Environment :: X11 Applications :: Qt",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
scrinium = "scrinium.cli:main"

[tool.setuptools.dynamic]
version = { attr = "scrinium.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scrinium = ["icons/*.svg", "icons/NOTICE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
